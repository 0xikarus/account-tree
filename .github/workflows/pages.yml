name: Publish account tree

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
      - name: Stage website files
        run: |
          mkdir "$RUNNER_TEMP/account-tree-pages"
          cp dist/index.html dist/app.js "$RUNNER_TEMP/account-tree-pages/"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/account-tree-pages

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
